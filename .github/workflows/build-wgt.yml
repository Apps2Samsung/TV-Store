name: Build .wgt
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check the service, the UI and the tests
        run: |
          for f in tizen-app/service/*.js tizen-app/js/app.js test/*.js scripts/*.js; do
            node --check "$f"
          done
      - name: Tests
        run: scripts/run-tests.sh
      # The TV's own Node: v4.4.3 on a 2019 Tizen 5.0 set (#881). Buffer.from, Buffer.alloc,
      # crypto.sign and friends are newer than that, and only fail there; run every test on it too.
      - uses: actions/setup-node@v4
        with:
          node-version: '4.4.3'
      - name: Tests on the TV's Node (4.4.3)
        run: scripts/run-tests.sh
      - name: Build the .wgt
        run: scripts/build-wgt.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Store-wgt
          path: dist/TV-Store.wgt
