name: Build .wgt
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check the service and UI
        run: |
          for f in tizen-app/service/sdb.js tizen-app/service/relay.js tizen-app/service/zip.js tizen-app/service/index.js tizen-app/service/signer.js tizen-app/service/catalog.js tizen-app/service/catalog-key.js tizen-app/service/compat.js tizen-app/service/manifest.js tizen-app/service/refusal.js tizen-app/service/certs.js tizen-app/service/sdbhosts.js tizen-app/service/wascmd.js tizen-app/service/selfupdate.js tizen-app/service/icons.js tizen-app/service/repos.js tizen-app/js/app.js test/fake-sdbd.js test/run.js test/relay.test.js test/relay-settings.test.js test/sign.test.js test/config.test.js test/sdb-errors.test.js test/manifest.test.js test/refusal.test.js test/certs.test.js test/install.test.js test/certlevel.test.js test/sdbhosts.test.js test/sdb-loopback.test.js test/sdb-tunnel.test.js test/wascmd.test.js test/selfupdate.test.js test/repos.test.js test/sources.test.js; do
            node --check "$f"
          done
      - name: config.xml ids (package id is 10 alphanumerics)
        run: node test/config.test.js
      - name: End-to-end sdb transport test (fake sdbd)
        run: node test/run.js
      - name: On-TV sdb relay (forwarding, allow list, session teardown)
        run: node test/relay.test.js
      - name: On-TV sdb relay settings (refused up front, restart only on change, answers once up)
        run: node test/relay-settings.test.js
      - name: Signer test (valid signed package)
        run: node test/sign.test.js
      - name: Streaming signer test (big package, file to file)
        run: node --expose-gc test/stream-sign.test.js
      - name: Bundled service test (direct, as a module, Tizen 10 vm wrapper)
        run: node test/bundle.test.js
      - name: Signed catalog test (signature, staleness, hashes)
        run: node test/catalog.test.js
      - name: Independent repositories, the spec's test vectors (#82)
        run: node test/repos.test.js
      - name: Sources in the service (check, add, per-source install, rollback, remove) (#82)
        run: node test/sources.test.js
      - name: sdb connect errors (refused, dropped without a reply)
        run: node test/sdb-errors.test.js
      - name: Package manifest ids (.wgt config.xml, .tpk tizen-manifest.xml)
        run: node test/manifest.test.js
      - name: Install refusals (another certificate, rejected certificate, Tizen version)
        run: node test/refusal.test.js
      - name: Signing profiles handed over (#44)
        run: node test/certs.test.js
      - name: Install against a fake sdbd (retry with the next profile, replace)
        run: node test/install.test.js
      - name: Public or Partner certificate per install (#50)
        run: node test/certlevel.test.js
      - name: sdb host order (TV IP or 127.0.0.1)
        run: node test/sdbhosts.test.js
      - name: Install over loopback (Host PC IP 127.0.0.1) and the HOST_PC_IP advice (#52)
        run: node test/sdb-loopback.test.js
      - name: Install through another app's sdb tunnel when it holds sdbd (#90)
        run: node test/sdb-tunnel.test.js
      - name: Install through wascmd from the service, sdbd as the fallback (#57)
        run: node test/wascmd.test.js
      - name: TV-Store updating itself, the marker across a stopped service (#41)
        run: node test/selfupdate.test.js
      - name: Another app's package id, the derived id and the rewrite (#84)
        run: node test/pkgid.test.js
      - name: A fork installed beside the app whose id it kept, against the service (#84)
        run: node test/rename.test.js
      # The TV's own Node: v4.4.3 on a 2019 Tizen 5.0 set (#881). Buffer.from, Buffer.alloc,
      # crypto.sign and friends are newer than that, and only fail there; run every test on it too.
      - uses: actions/setup-node@v4
        with:
          node-version: '4.4.3'
      - name: Tests on the TV's Node (4.4.3)
        run: |
          node --version
          node test/config.test.js
          node test/run.js
          node test/relay.test.js
          node test/relay-settings.test.js
          node test/sign.test.js
          node --expose-gc test/stream-sign.test.js
          node test/bundle.test.js
          node test/catalog.test.js
          node test/repos.test.js
          node test/sources.test.js
          node test/sdb-errors.test.js
          node test/manifest.test.js
          node test/refusal.test.js
          node test/certs.test.js
          node test/install.test.js
          node test/certlevel.test.js
          node test/sdbhosts.test.js
          node test/sdb-loopback.test.js
          node test/sdb-tunnel.test.js
          node test/wascmd.test.js
          node test/selfupdate.test.js
          node test/pkgid.test.js
          node test/rename.test.js
      - name: Build the .wgt
        run: scripts/build-wgt.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Store-wgt
          path: dist/TV-Store.wgt
