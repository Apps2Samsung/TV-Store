name: Build .wgt
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check the service and UI
        run: |
          for f in tizen-app/service/sdb.js tizen-app/service/index.js tizen-app/service/signer.js tizen-app/js/app.js test/fake-sdbd.js test/run.js; do
            node --check "$f"
          done
      - name: End-to-end sdb transport test (fake sdbd)
        run: node test/run.js
      - name: Build the .wgt
        run: scripts/build-wgt.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Store-wgt
          path: dist/TV-Store.wgt
