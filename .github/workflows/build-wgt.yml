name: Build .wgt
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check the service and UI
        run: |
          for f in tizen-app/service/sdb.js tizen-app/service/zip.js tizen-app/service/index.js tizen-app/service/signer.js tizen-app/service/catalog.js tizen-app/service/catalog-key.js tizen-app/service/compat.js tizen-app/js/app.js test/fake-sdbd.js test/run.js test/sign.test.js test/config.test.js; do
            node --check "$f"
          done
      - name: config.xml ids (package id is 10 alphanumerics)
        run: node test/config.test.js
      - name: End-to-end sdb transport test (fake sdbd)
        run: node test/run.js
      - name: Signer test (valid signed package)
        run: node test/sign.test.js
      - name: Streaming signer test (big package, file to file)
        run: node --expose-gc test/stream-sign.test.js
      - name: Bundled service test (direct, as a module, Tizen 10 vm wrapper)
        run: node test/bundle.test.js
      - name: Signed catalog test (signature, staleness, hashes)
        run: node test/catalog.test.js
      # The TV's own Node: v4.4.3 on a 2019 Tizen 5.0 set (#881). Buffer.from, Buffer.alloc,
      # crypto.sign and friends are newer than that, and only fail there; run every test on it too.
      - uses: actions/setup-node@v4
        with:
          node-version: '4.4.3'
      - name: Tests on the TV's Node (4.4.3)
        run: |
          node --version
          node test/config.test.js
          node test/run.js
          node test/sign.test.js
          node --expose-gc test/stream-sign.test.js
          node test/bundle.test.js
          node test/catalog.test.js
      - name: Build the .wgt
        run: scripts/build-wgt.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Store-wgt
          path: dist/TV-Store.wgt
