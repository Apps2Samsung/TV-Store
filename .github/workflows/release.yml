name: Release .wgt
# A tag v* becomes a GitHub release with TV-Store.wgt as its one asset: what the community catalog
# (tizen-community-packages, source "release") and the heads pull. The package is unsigned; the
# installing head signs it with the user's certificate, as with every package.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tests
        run: scripts/run-tests.sh
      # The TV's own Node (4.4.3 on a 2019 set): the build runs on Node 20, so switch back after.
      - uses: actions/setup-node@v4
        with:
          node-version: '4.4.3'
      - name: Tests on the TV's Node (4.4.3)
        run: scripts/run-tests.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Version in config.xml must match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # The <widget> tag spans several lines in config.xml, so read the file as one line.
          ver=$(tr '\n' ' ' < tizen-app/config.xml | sed -n 's/.*<widget[^>]*version="\([^"]*\)".*/\1/p')
          [ "$tag" = "$ver" ] || { echo "tag v$tag but config.xml says $ver"; exit 1; }
      - name: Build the .wgt
        run: scripts/build-wgt.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made as a draft first (with the build workflow's .wgt attached) has created
        # this tag by being published: keep it and its notes, and put the .wgt built here in place.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/TV-Store.wgt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/TV-Store.wgt --title "TV-Store $GITHUB_REF_NAME" --generate-notes
          fi
