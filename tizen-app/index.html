<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Apps2Samsung TV-Store</title>
<style>
  /* The Apps2Samsung v3 design language (Core/Design/DesignTokens.cs, issue #755), dark theme, scaled
     about 1.3x for a 1080p screen read from the couch. A hex value here is a token's value, not a
     choice of its own: Bg, Surface, Surface2, Ink, Muted, Hair, Fill, Accent*, OnAccent, Ok/Warn/Bad
     (+Soft) and the seven category tiles. */
  html,body{margin:0;height:100%;background:#000;color:#F2F2F7;font-family:"SamsungOne","Tizen Sans","Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;font-size:22px}
  *{box-sizing:border-box}
  .top{padding:30px 56px 10px;display:flex;align-items:flex-end;justify-content:space-between}
  h1{font-size:42px;font-weight:700;margin:0;letter-spacing:-.01em}
  h1 .dot{color:#2DD4BF}
  .sub{color:#98989F;font-size:19px;margin-top:6px;max-width:1300px}
  .sub.ok{color:#30C46E}.sub.warn{color:#F0A020}.sub.err{color:#FF5C50}
  .count{color:#98989F;font-size:19px;white-space:nowrap}
  .tright{display:flex;align-items:center;gap:20px}
  .gear{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;color:#F2F2F7;background:rgba(118,118,128,.24);border-radius:999px;padding:10px 20px;outline:none;cursor:pointer}
  .gear:focus{background:rgba(45,212,191,.18);box-shadow:inset 0 0 0 3px #2DD4BF}
  .gear svg{width:22px;height:22px}
  .main{display:flex;height:calc(100% - 158px);padding:0 56px}
  .list{width:50%;overflow-y:auto;padding:6px 28px 60px 0}
  .detail{flex:1;overflow-y:auto;padding:18px 0 60px 28px}
  .list::-webkit-scrollbar,.detail::-webkit-scrollbar{width:0}

  /* group title + count, then the card */
  .grp{display:flex;align-items:baseline;margin:22px 6px 8px}
  .grp .t{font-size:20px;font-weight:600;color:#98989F}
  .grp .n{font-size:20px;color:#98989F;opacity:.7;margin-left:8px}
  .card{background:#1C1C1E;border-radius:16px;overflow:hidden}
  .row{display:flex;align-items:center;padding:14px 20px;min-height:68px;outline:none;cursor:pointer;border-bottom:1px solid rgba(84,84,88,.55)}
  .row:last-child{border-bottom:0}
  .row:focus{background:rgba(45,212,191,.18);box-shadow:inset 0 0 0 3px #2DD4BF}
  .row.sel:not(:focus){background:rgba(118,118,128,.24)}
  .row.dim .name,.row.dim .tile{opacity:.5}
  .tile{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:26px;flex:none;margin-right:16px}
  .t-media{background:#2B59FF}.t-iptv{background:#E8590C}.t-streaming{background:#D6336C}.t-games{background:#7048E8}.t-casting{background:#0CA678}.t-tools{background:#5C677D}.t-other{background:#868E96}
  .txt{flex:1;min-width:0}
  .name{font-size:22px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{font-size:17px;color:#98989F;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chev{width:12px;height:20px;opacity:.35;margin-left:14px;flex:none}
  .badge{display:inline-block;font-size:15px;font-weight:600;border-radius:999px;padding:3px 11px;margin-left:10px;white-space:nowrap;vertical-align:middle}
  .b-ok{background:rgba(48,196,110,.18);color:#30C46E}.b-warn{background:rgba(240,160,32,.18);color:#F0A020}.b-mute{background:rgba(118,118,128,.24);color:#98989F}

  /* the app sheet */
  .sheet{background:#1C1C1E;border-radius:20px;padding:26px 28px}
  .sheet h2{font-size:30px;font-weight:700;margin:0 0 10px;display:flex;align-items:center}
  .desc{font-size:21px;line-height:1.5;color:#F2F2F7;margin:8px 0 6px}
  .subline{font-size:18px;color:#98989F;margin-bottom:12px}
  .pills{margin:4px 0 8px}
  .pill{display:inline-block;background:rgba(118,118,128,.24);color:#98989F;border-radius:999px;padding:4px 13px;font-size:16px;font-weight:500;margin:0 8px 8px 0}
  .pill.ok{background:rgba(48,196,110,.18);color:#30C46E}.pill.warn{background:rgba(240,160,32,.18);color:#F0A020}
  .notice{background:rgba(240,160,32,.18);border:1px solid #F0A020;color:#F0A020;border-radius:12px;padding:12px 16px;font-size:18px;line-height:1.45;margin:10px 0}
  .vh{font-size:20px;font-weight:600;color:#98989F;margin:18px 6px 8px}
  .vars{background:#2C2C2E;border-radius:14px;overflow:hidden}
  .var{display:flex;align-items:center;padding:13px 18px;outline:none;cursor:pointer;border-bottom:1px solid rgba(84,84,88,.55);font-size:20px}
  .var:last-child{border-bottom:0}
  .var:focus{background:rgba(45,212,191,.18);box-shadow:inset 0 0 0 3px #2DD4BF}
  .radio{width:24px;height:24px;border-radius:50%;border:2px solid #98989F;margin-right:16px;flex:none}
  .var.sel .radio{border-color:#2DD4BF;background:radial-gradient(circle,#2DD4BF 0 7px,transparent 8px)}
  .var .vl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .var .vv{color:#98989F;font-size:17px;margin-left:12px}
  .btns{display:flex;gap:14px;margin-top:18px}
  button{flex:1;font:inherit;font-size:21px;font-weight:600;min-height:64px;padding:0 28px;border:0;border-radius:14px;background:#2DD4BF;color:#042F2E;cursor:pointer;outline:none}
  button:focus{background:#5EEAD4;box-shadow:0 0 0 4px rgba(45,212,191,.35)}
  button:disabled{background:rgba(118,118,128,.24);color:#98989F;box-shadow:none}
  button.alt{background:rgba(118,118,128,.24);color:#F2F2F7;flex:0 0 auto}
  button.alt:focus{background:rgba(45,212,191,.18);box-shadow:inset 0 0 0 3px #2DD4BF}
  .status{margin-top:16px;font-size:19px;line-height:1.45;white-space:pre-wrap}
  .status.ok{color:#30C46E}.status.warn{color:#F0A020}.status.err{color:#FF5C50}
  .log{margin-top:10px;font-size:16px;line-height:1.5;color:#9FB0C6;background:#0D1B2A;border-radius:12px;padding:12px 16px;white-space:pre-wrap;font-family:Menlo,Consolas,monospace;display:none}
  .log.on{display:block}
  .empty{color:#98989F;font-size:20px;padding:40px 10px}

  /* the Settings screen: one row per switch */
  .opts{background:#2C2C2E;border-radius:14px;overflow:hidden;margin-top:8px}
  .opt{display:flex;align-items:center;padding:16px 20px;outline:none;cursor:pointer;border-bottom:1px solid rgba(84,84,88,.55)}
  .opt:last-child{border-bottom:0}
  .opt:focus{background:rgba(45,212,191,.18);box-shadow:inset 0 0 0 3px #2DD4BF}
  .ot{flex:1;min-width:0;margin-right:20px}
  .ont{font-size:21px;font-weight:500}
  .oh{font-size:17px;color:#98989F;margin-top:4px;line-height:1.4}
  .sw{width:64px;height:36px;border-radius:999px;background:rgba(118,118,128,.32);position:relative;flex:none}
  .sw .knob{position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#F2F2F7}
  .sw.on{background:#2DD4BF}
  .sw.on .knob{left:31px}
  .foot{position:absolute;bottom:0;left:0;right:0;padding:12px 56px;color:#98989F;font-size:16px;border-top:1px solid rgba(84,84,88,.55);background:#000}
  .foot b{color:#F2F2F7;font-weight:500}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>Apps2Samsung <span class="dot">&middot;</span> TV-Store</h1>
    <div class="sub" id="sub">Loading the catalog&hellip;</div>
  </div>
  <div class="tright">
    <div class="count" id="count"></div>
    <div class="gear" id="gear" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="#F2F2F7" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</div>
  </div>
</div>
<div class="main">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><div class="empty">Pick an app on the left.</div></div>
</div>
<div class="foot"><b>&#9650;&#9660;</b> move &nbsp;&nbsp; <b>&#9664;&#9654;</b> list / app &nbsp;&nbsp; <b>OK</b> select, install &nbsp;&nbsp; <b>&#9650;</b> at the top: Settings &nbsp;&nbsp; <b>RETURN</b> back</div>
<script src="js/app.js"></script>
</body>
</html>
